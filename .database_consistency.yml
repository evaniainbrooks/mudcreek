# Ignore false positive from Rails' ActionText and ActiveStorage
ActionText::RichText:
  enabled: false
ActiveStorage::Attachment:
  enabled: false
ActiveStorage::Blob:
  enabled: false
ActiveStorage::VariantRecord:
  enabled: false

# Conditional validators paired with partial indexes — database_consistency cannot
# correlate them, but both the DB constraint and the model validation are in place.
# UniqueIndexChecker uses index name as the key; MissingUniqueIndexChecker uses column name(s).
Transaction:
  index_transactions_on_order_id_succeeded:
    UniqueIndexChecker:
      enabled: false
  order_id:
    MissingUniqueIndexChecker:
      enabled: false

Tenant:
  index_tenants_on_default_true:
    UniqueIndexChecker:
      enabled: false
  default:
    MissingUniqueIndexChecker:
      enabled: false

Offer:
  index_offers_on_listing_id_where_accepted:
    UniqueIndexChecker:
      enabled: false
  listing_id:
    MissingUniqueIndexChecker:
      enabled: false

AuctionListing:
  # Partial indexes (WHERE clause) paired with a single uniqueness validator —
  # database_consistency cannot correlate partial indexes with model validators.
  index_auction_listings_on_listing_id_and_variant_id:
    UniqueIndexChecker:
      enabled: false
  index_auction_listings_on_listing_id_no_variant:
    UniqueIndexChecker:
      enabled: false
  listing_id+variant_id:
    MissingUniqueIndexChecker:
      enabled: false

CartItem:
  # Partial indexes (WHERE clause) — database_consistency cannot correlate these
  # with conditional validators, but both the DB constraint and model validation are in place.
  index_cart_items_on_invoice_item_id_unique:
    UniqueIndexChecker:
      enabled: false
  index_cart_items_unique_user_listing_variant:
    UniqueIndexChecker:
      enabled: false
  index_cart_items_unique_guest_listing_variant:
    UniqueIndexChecker:
      enabled: false
  invoice_item_id:
    MissingUniqueIndexChecker:
      enabled: false
  listing_id+user_id+variant_id:
    MissingUniqueIndexChecker:
      enabled: false
  listing_id+guest_cart_token+variant_id:
    MissingUniqueIndexChecker:
      enabled: false
