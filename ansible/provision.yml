---
- name: Provision mudcreek VPS
  hosts: all
  become: true

  vars:
    docker_compose_version: "2.27.0"

  tasks:
    # ── System ────────────────────────────────────────────────────────────────
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install system dependencies
      apt:
        name:
          - curl
          - git
          - ufw
          - ca-certificates
          - gnupg
          - lsb-release
          - htop
          - unzip
          - postgresql-client
          - fail2ban
          - unattended-upgrades
          - chrony
        state: present

    # ── Docker ────────────────────────────────────────────────────────────────
    - name: Create Docker keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker CE
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Add root to docker group
      user:
        name: root
        groups: docker
        append: true

    # ── Firewall ──────────────────────────────────────────────────────────────
    - name: Allow SSH
      ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP
      ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS
      ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Enable UFW (default deny incoming)
      ufw:
        state: enabled
        policy: deny
        direction: incoming

    # ── Swap (useful for smaller VPS) ─────────────────────────────────────────
    - name: Check if swap file exists
      stat:
        path: /swapfile
      register: swap_file

    - name: Create 2GB swap file
      command: fallocate -l 2G /swapfile
      when: not swap_file.stat.exists

    - name: Set swap file permissions
      file:
        path: /swapfile
        mode: "0600"
      when: not swap_file.stat.exists

    - name: Format swap file
      command: mkswap /swapfile
      when: not swap_file.stat.exists

    - name: Enable swap
      command: swapon /swapfile
      when: not swap_file.stat.exists

    - name: Persist swap in fstab
      lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present

    # ── Sysctl tuning ─────────────────────────────────────────────────────────
    - name: Set swappiness to 10
      sysctl:
        name: vm.swappiness
        value: "10"
        state: present
        reload: true

    - name: Tune sysctl for Rails/Postgres workload
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
      loop:
        - { name: net.core.somaxconn, value: "1024" }
        - { name: net.ipv4.tcp_fin_timeout, value: "15" }
        - { name: net.ipv4.tcp_tw_reuse, value: "1" }
        - { name: vm.overcommit_memory, value: "1" }

    # ── Open file limits ──────────────────────────────────────────────────────
    - name: Raise open file descriptor limits
      pam_limits:
        domain: "*"
        limit_type: "{{ item.type }}"
        limit_item: nofile
        value: "65536"
      loop:
        - { type: soft }
        - { type: hard }

    # ── Docker daemon config ──────────────────────────────────────────────────
    - name: Configure Docker log rotation
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
        mode: "0644"
      notify: Restart Docker

    # ── Security ──────────────────────────────────────────────────────────────
    - name: Enable fail2ban
      systemd:
        name: fail2ban
        enabled: true
        state: started

    - name: Enable unattended security upgrades
      copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

    # ── Time sync ─────────────────────────────────────────────────────────────
    - name: Enable and start chrony
      systemd:
        name: chrony
        enabled: true
        state: started

    - name: Verify Docker is running
      command: docker info
      changed_when: false

  handlers:
    - name: Restart Docker
      systemd:
        name: docker
        state: restarted
