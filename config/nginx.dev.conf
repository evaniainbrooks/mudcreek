worker_processes 1;
error_log /tmp/nginx_dev_error.log;
pid /tmp/nginx_dev.pid;

events {
  worker_connections 1024;
}

http {
  access_log            /tmp/nginx_dev_access.log;
  client_body_temp_path /tmp/nginx_dev_client_body;
  proxy_temp_path        /tmp/nginx_dev_proxy;
  fastcgi_temp_path      /tmp/nginx_dev_fastcgi;
  uwsgi_temp_path        /tmp/nginx_dev_uwsgi;
  scgi_temp_path         /tmp/nginx_dev_scgi;

  server {
    listen 4000;

    # Proxy /imgproxy/* → imgproxy on :8080 (strip the /imgproxy prefix)
    location /imgproxy/ {
      proxy_pass http://127.0.0.1:8080/;
    }

    # Proxy /s3/* → localstack on :4566 (strip the /s3 prefix)
    location /s3/ {
      proxy_pass http://127.0.0.1:4566/;

      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin'  '*';
        add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Content-MD5, Content-Length, Authorization, X-Amz-Date, X-Amz-Security-Token, X-Requested-With';
        add_header 'Access-Control-Max-Age'       '3600';
        return 204;
      }

      add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Proxy /mailhog/api/v2/websocket → MailHog live-update WebSocket
    location /mailhog/api/v2/websocket {
      proxy_pass         http://127.0.0.1:8025/api/v2/websocket;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
    }

    # Proxy /mailhog/* → MailHog web UI on :8025 (strip the /mailhog prefix)
    location /mailhog/ {
      proxy_pass http://127.0.0.1:8025/;
    }

    # WebSocket upgrade for Action Cable
    location /cable {
      proxy_pass         http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 3600s;
    }

    # Proxy everything else → puma on :3000
    location / {
      proxy_pass         http://127.0.0.1:3000;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 300s;
    }
  }
}
