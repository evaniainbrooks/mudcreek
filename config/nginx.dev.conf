worker_processes 1;
error_log /tmp/nginx_dev_error.log;
pid /tmp/nginx_dev.pid;

events {
  worker_connections 1024;
}

http {
  access_log            /tmp/nginx_dev_access.log;
  client_body_temp_path /tmp/nginx_dev_client_body;
  proxy_temp_path        /tmp/nginx_dev_proxy;
  fastcgi_temp_path      /tmp/nginx_dev_fastcgi;
  uwsgi_temp_path        /tmp/nginx_dev_uwsgi;
  scgi_temp_path         /tmp/nginx_dev_scgi;

  server {
    listen 4000;

    # Proxy /imgproxy/* → imgproxy on :8080 (strip the /imgproxy prefix)
    location /imgproxy/ {
      proxy_pass http://127.0.0.1:8080/;
    }

    # Proxy everything else → puma on :3000
    location / {
      proxy_pass         http://127.0.0.1:3000;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 300s;
    }
  }
}
